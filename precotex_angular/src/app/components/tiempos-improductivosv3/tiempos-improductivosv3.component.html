
<div class="tiempo-improductivov3-container">
    <div class="selector-titulo">
        <h3 class="titulo">REGISTRO DE TIEMPO IMPRODUCTIVO</h3>
    </div>

    <form [formGroup]="formulario" #formDirective="ngForm">
        <div class="form-columns">

            <section class="left">


                <input type="hidden" formControlName="Fec_Terminado">

                <!-- Primera Fila -->
                <div class="row two-columns">
                    <mat-form-field appearance="outline" class="dni-field">
                        <mat-label>DNI</mat-label>
                        <input matInput type="text" (keyup)="MostrarTejedor1()" autocomplete="off" formControlName="dni" maxlength="8" placeholder="Dni Trabajador">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="operador-field" >
                        <mat-label>Operador</mat-label>                        
                        <input matInput formControlName="operador" readonly>
                    </mat-form-field>
                </div>                   

                <!-- Segunda Fila -->
                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Máquina</mat-label>
                        <mat-select formControlName="maquina" (selectionChange)="onMaquinaSeleccionada()">
                            <mat-option *ngFor="let lstMaq of lstMaquinas" [value]="lstMaq.Codigo">{{lstMaq.Descripcion}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div> 
                
                <!-- Tercera Fila -->
                <div class="row two-columns">
                    <mat-form-field appearance="outline" class="codigo-field">
                        <mat-label>Codigo Motivo</mat-label>
                        <input matInput formControlName="codMotivo"
                                        maxlength="2"
                                        (input)="onCodigoChange()">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="motivo-field">
                        <mat-label>Motivo</mat-label>
                        <input matInput formControlName="motivo" readonly>
                    </mat-form-field>                
                </div>

                <!-- Cuarta Fila -->
                <div class="row two-columns">
                    <button mat-raised-button color="primary" class="btn-action" (click)="onIniciar()" [disabled]="flgBtnIniciar" >
                        <mat-icon>timer</mat-icon>
                        Iniciar
                    </button>

                    <button mat-raised-button color="primary" class="btn-action" (click)="onTerminar()" [disabled]="flgBtnDetener">
                        <mat-icon>stop</mat-icon>
                        Detener
                    </button>                
                </div>
                <br>
                <!-- Quinta Fila -->
                <div class="row two-columns">
                    <mat-form-field appearance="outline" class="horaIni-field">
                        <mat-label>Hora Inicio</mat-label>
                        <input matInput formControlName="horaIni" placeholder="00:00" readonly>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="horaFin-field">
                        <mat-label>Hora Fin</mat-label>
                        <input matInput formControlName="horaFin" placeholder="00:00" readonly>
                    </mat-form-field>                
                </div>

                <!-- Quinta Fila: Observación -->
                <div class="row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Observación</mat-label>
                        <textarea matInput formControlName="observacion" rows="3"></textarea>
                    </mat-form-field>
                </div>  
                
                <!-- Sexta Fila -->
                <div class="row two-columns">

                    <!-- <button mat-raised-button color="primary" class="btn-action">
                        <mat-icon>add_box</mat-icon>
                        Nuevo
                    </button> -->
                    
                    <button mat-raised-button color="primary" class="btn-action"            (click)="onRegistrar()">
                        <mat-icon>save</mat-icon>
                        Registrar
                    </button>
                    
                    <button mat-raised-button color="primary" class="btn-action btn-green"  (click)="onHistorial()"> 
                        <mat-icon>history</mat-icon> 
                        Historial 
                    </button>        
                    
                    <button mat-raised-button color="warn" class="btn-action"               (click)="onCancelar()">
                        <mat-icon>cancel</mat-icon>
                        Cancelar
                    </button>                         
                    
                </div>

                <!-- Septima Fila -->
                <div class="row">
                    <!-- <button mat-raised-button color="primary" class="btn-action btn-green"  (click)="onHistorial()"> 
                        <mat-icon>history</mat-icon> Historial 
                    </button>              -->
                </div>

            </section>

            <section class="right">

                <!-- <h3 class="subtitulo">LISTADO DE MOTIVO</h3> -->
                <div class="responsive-table">
                    <div class="table-wrapper">

                        <table mat-table class="mat-elevation-z1" #table [dataSource]="dataSource" >

                        <ng-container matColumnDef="codigo">
                            <th mat-header-cell *matHeaderCellDef>Código</th>
                            <td mat-cell *matCellDef="let row" class="memo-cell">{{ row.Codigo }}</td>
                        </ng-container>                    

                        <ng-container matColumnDef="descripcion">
                            <th mat-header-cell *matHeaderCellDef> Motivo </th>
                            <td mat-cell *matCellDef="let m"> {{ m.Descripcion }} </td>
                        </ng-container>

                        <ng-container matColumnDef="area">
                            <th mat-header-cell *matHeaderCellDef> Area </th>
                            <td mat-cell *matCellDef="let m"> {{ m.Area }} </td>
                        </ng-container>                        

                        <!-- <ng-container matColumnDef="area">
                            <th mat-header-cell *matHeaderCellDef> AREA </th>
                            <td mat-cell *matCellDef="let m"> {{ m.area }} </td>
                        </ng-container> -->

                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                                            (click)="onRowClick(row)"
                                            [class.selected]="selectedRow === row"></tr>     
                        </table>            
                    </div>
                </div>
            </section>    

        </div>
    </form>
</div>


<ngx-spinner bdColor="rgba(51, 51, 51, 0.8)" size="default">
    <div class="loader"></div>
</ngx-spinner>
