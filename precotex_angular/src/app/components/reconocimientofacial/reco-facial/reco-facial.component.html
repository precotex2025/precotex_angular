
<div class="carousel">
  <div class="slide" *ngFor="let foto of fotosVisibles">
    <img [src]="foto.foto" alt="Foto No Registrada" />
    <div class="nombre">{{ foto.nombre }}</div>
    <!-- <div class="nombre"><p>Dominic A.</p></div> -->
  </div>
</div>

<button class="boton-flotante fullscreen" (click)="alternarPantallaCompleta()" matTooltip="Pantalla completa">
    <mat-icon>fullscreen</mat-icon>
</button>
