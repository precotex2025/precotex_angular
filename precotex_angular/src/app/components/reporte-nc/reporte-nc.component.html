<mat-card class="form-container">
  <form>

    <!-- Fecha y Hora -->
    <div class="form-section">
      <div class="fecha-hora-row">
        <mat-form-field appearance="fill">
          <mat-label>Fecha</mat-label>
          <input matInput [value]="formData.rep_FecObs" readonly>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Hora</mat-label>
          <input matInput [value]="formData.rep_HorObs" readonly>
        </mat-form-field>
      </div>
    </div>

    <!-- Sede -->
    <div class="form-section">
      <div class="section-title">Sede</div>
      <div class="button-group">
        <button 
                *ngFor="let sede of sedes"
                mat-button
                [ngClass]="{ 'selected': sede.num_Planta.toString() === sedeSeleccionada }"
                (click)="selectSede(sede)">
          {{ sede.des_Planta }}
        </button>
      </div>
    </div>

    <!-- Área y Ubicación -->
    <div class="form-section">
      <!-- <div class="section-title">Área y Ubicación</div> -->
      <mat-form-field appearance="fill">
        <mat-label>Área</mat-label>
        <mat-select [(ngModel)]="formData.are_Id" name="areaId">
        <mat-option *ngFor="let a of areas" [value]="a.are_Id">{{ a.are_Des }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Especificación del lugar</mat-label>
        <input matInput [(ngModel)]="formData.rep_Esp" name="lugar">
      </mat-form-field>
    </div>

    <!-- Clasificación -->
    <div class="form-section">
      <div class="section-title">Clasificación de la NC</div>
      <div class="button-group">
        <button *ngFor="let clas of clasificaciones"
                mat-button
                [ngClass]="{ 'selected': clas.cla_Id === clasificacionSeleccionada}"
                (click)="selectClasificacion(clas)">
          {{ clas.cla_Des }}
        </button>
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-section">
      <!-- <div class="section-title">Descripción de la NC</div> -->
      <mat-form-field appearance="fill">
        <mat-label>Descripción</mat-label>
        <textarea matInput rows="3" [(ngModel)]="formData.rep_DesNC" name="descripcion"></textarea>
      </mat-form-field>
    </div>

    <!-- Nivel de riesgo -->
    <div class="form-section">
      <div class="section-title">Nivel de Riesgo</div>
      <div class="button-group">
        <button *ngFor="let nivel of niveles"
                mat-button
                [ngStyle]="cambiarEstilo(nivel)"
                
                (click)="selectNivel(nivel)">
          {{ nivel.niv_Rgo_Des }}
        </button>
      </div>
    </div>

    <!-- Acción y Responsable -->
    <div class="form-section">
      <!-- <div class="section-title">Acción Correctiva</div> -->
      <mat-form-field appearance="fill">
        <mat-label>Acción Correctiva Propuesta Por Usuario</mat-label>
        <input matInput [(ngModel)]="formData.rep_AccCor" name="accion">
      </mat-form-field>

      <!-- Botón para agregar imágenes -->
      <div class="image-upload">
        <button mat-stroked-button color="accent" (click)="fileInput.click()">
          <mat-icon>add_photo_alternate</mat-icon>
          Agregar imágenes (máx. 2)
        </button>
        <input #fileInput type="file"
              accept="image/*"
              multiple
              hidden
              (change)="onImagenesSeleccionadas($event)">
      </div>

      <!-- Galería de imágenes -->
      <div class="form-section">
        <div class="image-gallery">
          <div class="image-item" *ngFor="let img of imagenesAdjuntas; let i = index">
            <img [src]="img.base64ParaVista" alt="{{ img.nombre }}" class="preview-image" />
            <div class="image-name">{{ img.nombre.substring(img.nombre.indexOf('_') + 1) }}</div>
            <button mat-icon-button color="warn" (click)="eliminarImagen(i, img.img_Id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
          <div *ngIf="imagenesAdjuntas.length === 0" class="placeholder">
            No hay imágenes seleccionadas
          </div>
        </div>
      </div>



      <mat-form-field appearance="fill">
        <mat-label>Responsable de la subsanación</mat-label>
        <mat-select [(ngModel)]="formData.resp_Id" name="responsableId">
        <mat-option *ngFor="let r of responsables" [value]="r.resp_Id">{{ r.resp_Nom }}</mat-option>
      </mat-select>
      </mat-form-field>
    </div>

    <!-- Botones -->
    <div class="action-buttons">
      <button mat-flat-button color="primary" (click)="onProcesar()">Guardar</button>
      <button mat-button color="warn" (click)="onCancelar()">Cancelar</button>
    </div>

  </form>
</mat-card>
