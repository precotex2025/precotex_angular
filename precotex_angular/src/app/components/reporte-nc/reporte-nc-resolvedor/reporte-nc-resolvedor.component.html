    <mat-card class="form-container">
    <form>

        <!-- Fecha y Hora -->
        <div class="form-section">
        <div class="fecha-hora-row">
            <mat-form-field appearance="fill">
            <mat-label>Fecha de Observación</mat-label>
            <input matInput [(ngModel)]="formData.fechaObservacion" name="fechaObservacion" readonly>
            </mat-form-field>
        </div>
        </div>

        <!-- Descripción -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Descripción</mat-label>
            <textarea matInput rows="3" [(ngModel)]="formData.descripcion" name="descripcion" readonly></textarea>
        </mat-form-field>
        </div>

        <!-- Estado y Calificación de Riesgo -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Estado</mat-label>
            <input matInput [(ngModel)]="formData.estado" name="estado" readonly>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Nivel de Riesgo</mat-label>
            <input matInput [(ngModel)]="formData.riesgo" name="riesgo" readonly>
        </mat-form-field>
        </div>

        <!-- Acción Correctiva -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Acción Correctiva</mat-label>
            <input matInput [(ngModel)]="formData.accionCorrectiva" name="accionCorrectiva" readonly>
        </mat-form-field>
        </div>

        <!-- Ubicación, Reportado Por, Responsable, Área -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Ubicación</mat-label>
            <input matInput [(ngModel)]="formData.ubicacion" name="ubicacion" readonly>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Reportado Por</mat-label>
            <input matInput [(ngModel)]="formData.reportadoPor" name="reportadoPor" readonly>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Responsable</mat-label>
            <input matInput [(ngModel)]="formData.responsable" name="responsable" readonly>
        </mat-form-field>
        
        <mat-form-field appearance="fill">
            <mat-label>Área</mat-label>
            <input matInput [(ngModel)]="formData.area" name="area" readonly>
        </mat-form-field>
        </div>

        <!-- Imágenes -->
        <div class="form-section">
        <div class="image-gallery">
            <ng-container *ngFor="let img of imagenes; let i = index">
            <img [src]="img" alt="Imagen {{ i + 1 }}" class="preview-image" />
            </ng-container>
            <ng-container *ngIf="imagenes.length === 0">
            <div class="placeholder">No hay imágenes disponibles</div>
            </ng-container>
        </div>
        </div>

        <!-- Aceptar -->
        <div class="form-section">
        <div class="section-title">Aceptar</div>
        <mat-radio-group [(ngModel)]="formData.aceptar" name="aceptar" (change)="onAceptarChange($event)">
            <mat-radio-button value="1" style="margin-right: 15px;">Sí</mat-radio-button>
            <mat-radio-button value="0">No</mat-radio-button>
        </mat-radio-group>
        </div>

        <!-- Responsable -->
        <mat-form-field appearance="fill">
            <mat-label>Responsable</mat-label>
            <mat-select [(ngModel)]="formData.responsableLevantamiento" 
                        name="responsableLevantamiento"
                        [disabled]="formData.aceptar !== '1'">
            <mat-option *ngFor="let responsable of responsables" [value]="responsable.value">{{ responsable.label }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Acción Correctiva Tomada y Fecha de Levantamiento -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Acción Correctiva Tomada</mat-label>
            <input matInput [(ngModel)]="formData.accionTomada" name="accionTomada">
        </mat-form-field>

        <div class="fecha-hora-row">
            <mat-form-field appearance="fill">
            <mat-label>Fecha de levantamiento</mat-label>
            <input matInput [value]="formData.fecha" readonly>
            </mat-form-field>

            <mat-form-field appearance="fill">
            <mat-label>Hora de levantamiento</mat-label>
            <input matInput [value]="formData.hora" readonly>
            </mat-form-field>
        </div>
        </div>

        <!-- Cierre de NC -->
        <div class="form-section">
        <div class="section-title">Cierre de NC</div>
        <div class="status-buttons">
            <button mat-button
                    *ngFor="let cierre of cierres"
                    [ngClass]="{ 'selected': cierre.est_Id === cierreSeleccionado }"
                    (click)="selectCierre(cierre)">
            {{ cierre.est_Des }}
            </button>
        </div>
        </div>

        <!-- Detallar Observación -->
        <div class="form-section">
        <mat-form-field appearance="fill">
            <mat-label>Detallar Observación</mat-label>
            <textarea matInput rows="3" [(ngModel)]="formData.observacion" 
                    name="observacion"
                    [disabled]="formData.est_Id != '3'"></textarea>
        </mat-form-field>
        </div>

        <!-- Botones finales -->
        <div class="action-buttons">
        <button mat-raised-button color="primary" (click)="onGuardar()">Guardar</button>
        <button mat-button color="warn" (click)="onCancelar()">Cancelar</button>
        </div>

    </form>
    </mat-card>
