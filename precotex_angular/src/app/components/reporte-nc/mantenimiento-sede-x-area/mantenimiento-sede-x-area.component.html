<div class="area-list-container">
<div class="header-row">
    <!-- <h2>Listado de Áreas</h2> -->
    <button mat-raised-button color="primary" (click)="crearArea()">Nuevo</button>
    <button mat-raised-button color="secondary" (click)="cerrar()">Cerrar</button>
</div>

<div class="table-responsive">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- Código Área -->
    <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Cod. Área</th>
        <td mat-cell *matCellDef="let area">{{ area.are_Id }}</td>
    </ng-container>

    <!-- Descripción -->
    <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Nom. Área</th>
        <td mat-cell *matCellDef="let area">{{ area.are_Des }}</td>
    </ng-container>

    <!-- Sede -->
    <ng-container matColumnDef="sede">
        <th mat-header-cell *matHeaderCellDef>Sede</th>
        <td mat-cell *matCellDef="let area">{{ area.des_Planta }}</td>
    </ng-container>

    <!-- Acción -->
    <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef>Acción</th>
        <td mat-cell *matCellDef="let area">
        <button mat-icon-button color="accent" (click)="editarArea(area)">
            <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarArea(area.are_Id)">
            <mat-icon>delete</mat-icon>
        </button>
        </td>
    </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <div *ngIf="areas.length === 0" class="no-data">
    No hay áreas registradas.
    </div>
    <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons>
    </mat-paginator>
</div>
</div>
