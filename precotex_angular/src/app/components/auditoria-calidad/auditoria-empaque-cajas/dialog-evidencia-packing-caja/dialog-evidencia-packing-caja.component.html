<div class="container-fluid">
    <div class="grid-container">
        <div class="title">Evidencia Auditoria Empaque</div>

        <div class="find">
            <form class="list-form" [formGroup]="formulario" #formDirective="ngForm" (ngSubmit)="submit(formDirective)" >
                <mat-card>
                    <mat-card-content>
                        <mat-form-field class="example-width-35"> 
                            <mat-label>Packing List</mat-label>
                            <input matInput type="number" placeholder="Packing List" autocomplete="off" formControlName="Num_Packing" >
                        </mat-form-field>

                        <mat-form-field class="example-width-35"> 
                            <mat-label>Número Secuencia</mat-label>
                            <input matInput type="number" placeholder="Número Secuencia" autocomplete="off" formControlName="Num_SecPacking" (change)="onValidarSecuencia()">
                        </mat-form-field>

                        <button type="button" (click)="capturarFoto()" mat-mini-fab color="primary" *ngIf="ll_nuevo && ll_caja"><mat-icon>photo_camera</mat-icon></button>

                        <mat-form-field class="example-width-35"> 
                            <mat-label>Número Caja</mat-label>
                            <input matInput type="number" placeholder="Número Caja" autocomplete="off" formControlName="Num_Caja" >
                        </mat-form-field>

                        <mat-form-field class="example-width-35"> 
                            <mat-label>Carton Label</mat-label>
                            <input matInput type="text" placeholder="Carton Label" autocomplete="off" formControlName="Carton_Label" >
                        </mat-form-field>

                        <input type="file" accept="image/png,image/jpeg" style="display:none;" #inputFile (change)="onGuardarImagen($event)">
                        <button type="button" (click)="inputFile.click()" mat-mini-fab color="primary" *ngIf="ll_nuevo && ll_caja"><mat-icon>add_photo_alternate</mat-icon></button>    

                        <div class="image-container">
                            <div *ngIf="Imagen64">
                                <img [src]="Imagen64" style="max-width: 550px;" alt="" >
                            </div>
                        </div>
                        <mat-divider></mat-divider>
                    </mat-card-content>

                    <mat-card-actions>
                        <button mat-button type="submit" color="primary" [disabled]="formulario.invalid"><mat-icon>done</mat-icon>Grabar</button>
                        <button mat-button type="button" color="accent" (click)="onLimpiarRegistro()"><mat-icon>replay</mat-icon>Limpiar</button>
                        <button mat-button mat-dialog-close color="warn"><mat-icon>close</mat-icon>Salir</button>
                    </mat-card-actions>
                </mat-card>
            </form>
        </div>
    </div>
</div>
