<div class="container-fluid">
    <div class="grid-container">
        <div class="title">Evidencia Auditoria Empaque - Caja N° {{data.Num_Caja}}</div>

        <div class="find">
            <div class="list-form" [formGroup]="formulario">
                <mat-card>
                    <mat-card-content>
                        <mat-form-field class="example-width-35"> 
                            <mat-label>Peso (Kg.)</mat-label>
                            <input matInput type="number" placeholder="Peso Caja" autocomplete="off" formControlName="Peso_Caja" >
                        </mat-form-field>

                        <input type="file" accept="image/png,image/jpeg" style="display:none;" #inputFile (change)="onGuardarImagen($event)">
                        <button type="button" (click)="inputFile.click()" mat-mini-fab color="primary"><mat-icon>add_photo_alternate</mat-icon></button>    

                        <div class="image-container">
                            <div *ngIf="Imagen64">
                                <img [src]="Imagen64" style="max-width: 550px;" alt="" >
                            </div>
                        </div>
                        <mat-divider></mat-divider>
                    </mat-card-content>

                    <mat-card-actions>
                        <button mat-button type="submit" color="primary" [mat-dialog-close]="formulario.value" [disabled]="formulario.invalid"><mat-icon>done</mat-icon>Confirmar</button>
                        <button mat-button mat-dialog-close color="warn"><mat-icon>close</mat-icon>Cancelar</button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>
</div>
