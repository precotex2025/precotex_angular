<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo — Gestión de No Conformidades</title>
<style>
  :root{
    --dark:#1c1f24; --panel:#20242b; --accent:#2962ff; --accent-dark:#1f4fd6;
    --accent-light:#e4ebff; --teal:#125a66; --grey:#757575; --grey-light:#9aa0a8;
    --border:#d9dce1; --green:#2e7d32; --red:#c0392b; --amber:#b36b00;
    --bg-page:#e9ebee; --bg-app:#ffffff; --bg-soft:#f6f7f9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg-page); color:var(--dark); -webkit-tap-highlight-color:transparent;
  }
  .phone{
    max-width:430px; margin:22px auto; background:var(--bg-app);
    border-radius:22px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.18);
    min-height:800px; display:flex; flex-direction:column; position:relative;
  }
  @media (max-width:480px){
    .phone{ margin:0; border-radius:0; min-height:100vh; box-shadow:none; }
    body{ background:var(--bg-app); }
  }
  .status{ display:flex; justify-content:space-between; padding:8px 16px 4px; font-size:12px; font-weight:600; color:var(--dark); }
  .topbar{ background:var(--dark); color:#fff; padding:10px 16px 14px; display:flex; align-items:center; gap:8px; }
  .topbar .back{ font-size:22px; cursor:pointer; padding:0 4px; line-height:1; user-select:none; }
  .topbar .titles{ flex:1; }
  .topbar h1{ font-size:17px; margin:0; font-weight:700; }
  .topbar p{ font-size:11px; margin:2px 0 0; color:#b9bfc9; }
  .content{ flex:1; overflow-y:auto; padding:16px; padding-bottom:14px; }
  .bottombar{ padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:10px; background:#fff; }
  h2.section{ font-size:15px; font-weight:700; margin:18px 0 8px; color:var(--dark); }
  h2.section:first-child{ margin-top:0; }
  .card{ background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card-white{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .row{ display:flex; gap:10px; }
  .row > div{ flex:1; min-width:0; }
  label{ font-size:11px; font-weight:700; color:var(--dark); display:flex; justify-content:space-between; margin-bottom:4px; }
  label .tag{ font-size:9px; font-weight:700; color:var(--green); letter-spacing:.03em; }
  label .req{ color:var(--red); }
  input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px;
    font-size:14px; background:#fff; color:var(--dark); font-family:inherit;
    -webkit-appearance:none; appearance:none; letter-spacing:normal; box-sizing:border-box;
  }
  input[type=password]::-webkit-credentials-auto-fill-button,
  input[type=password]::-webkit-caps-lock-indicator,
  input[type=password]::-webkit-contacts-auto-fill-button{
    visibility:hidden; display:none !important; pointer-events:none; position:absolute; right:0;
  }
  input[readonly]{ background:var(--bg-soft); color:#666; }
  textarea{ resize:vertical; min-height:56px; }
  .field{ margin-bottom:12px; }
  .field.error input, .field.error select, .field.error textarea{ border-color:var(--red); background:#fff6f6; }
  .field-err{ color:var(--red); font-size:11px; margin-top:3px; }
  .hint{ color:var(--grey); font-size:11px; margin:2px 0 10px; }
  .banner-error{ background:#fdecea; border:1px solid var(--red); color:var(--red); padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; }
  .banner-sim{ background:#fff8e6; border:1px solid var(--amber); color:var(--amber); padding:8px 10px; border-radius:8px; font-size:11px; margin-bottom:12px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ border-radius:8px; border:2px solid var(--accent); padding:11px 14px; font-weight:700; font-size:13.5px; background:#fff; color:var(--accent); flex:1; text-align:center; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-dark); }
  .btn-secondary{ background:#fff; color:var(--dark); border-color:var(--border); }
  .btn-danger{ background:#fff; color:var(--red); border-color:var(--red); }
  .btn-danger-solid{ background:var(--red); color:#fff; border-color:var(--red); }
  .btn-amber-solid{ background:var(--amber); color:#fff; border-color:var(--amber); }
  .btn-teal{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 10px; font-size:12px; flex:none; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .stepper{ margin-bottom:14px; }
  .stepper .steplabel{ font-size:11px; color:var(--grey); margin-bottom:6px; }
  .stepper .bar{ height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  .stepper .bar > div{ height:100%; background:var(--accent); transition:width .2s; }
  .stepper .curstep{ font-weight:700; font-size:13.5px; margin-top:6px; }
  .art-card{ border:2px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px; background:#fff; }
  .art-card.checked{ border-color:var(--accent); background:var(--accent-light); }
  .art-top{ display:flex; align-items:flex-start; gap:10px; }
  .chk{ width:20px; height:20px; border-radius:5px; border:2px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .chk.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-size:13px; font-weight:700; }
  .art-name{ font-weight:700; font-size:13.5px; flex:1; }
  .art-badge{ font-size:10px; border:1px solid var(--accent); color:var(--accent); border-radius:8px; padding:2px 8px; white-space:nowrap; }
  .art-grid{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin:8px 0 8px 30px; }
  .art-grid div span{ display:block; }
  .art-grid .lbl{ font-size:9px; color:var(--grey); }
  .art-grid .val{ font-size:12px; font-weight:600; }
  .qty-wrap{ margin-left:30px; }
  .qty-wrap input{ max-width:120px; }
  .list-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:9px; }
  .list-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; }
  .list-sub{ font-size:11px; color:var(--grey); margin-top:3px; }
  .list-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .linklike{ color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; }
  .chip{ display:inline-block; padding:4px 12px; border-radius:12px; font-size:11px; font-weight:700; border:1.5px solid; margin-right:6px; cursor:pointer; }
  .chip-crit{ color:var(--red); border-color:var(--red); }
  .chip-grave{ color:var(--amber); border-color:var(--amber); }
  .chip-leve{ color:var(--green); border-color:var(--green); }
  .chip-all{ color:var(--grey); border-color:var(--grey-light); }
  .chip.active.chip-crit{ background:var(--red); color:#fff; }
  .chip.active.chip-grave{ background:var(--amber); color:#fff; }
  .chip.active.chip-leve{ background:var(--green); color:#fff; }
  .chip.active.chip-all{ background:var(--grey-light); color:#fff; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:10px; font-size:10.5px; font-weight:700; color:#fff; }
  .badge-blue{ background:var(--accent); }
  .badge-red{ background:var(--red); }
  .kv{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; gap:10px; }
  .kv .k{ color:var(--grey); flex:none; }
  .kv .v{ font-weight:600; text-align:right; }
  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .card-head b{ font-size:13px; }
  .center-screen{ text-align:center; padding-top:60px; }
  .check-circle{ width:74px; height:74px; border-radius:50%; background:var(--green); color:#fff; font-size:34px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .photo-box{ width:78px; height:78px; border:1px solid var(--border); border-radius:8px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--grey); position:relative; overflow:hidden; margin-right:8px; margin-bottom:8px; background:#eee; }
  .photo-box img{ width:100%; height:100%; object-fit:cover; }
  .photo-add{ background:#fff; color:var(--accent); font-weight:700; font-size:20px; border:1.5px dashed var(--accent); cursor:pointer; }
  .photo-x{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border-radius:50%; width:16px; height:16px; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .overlay{ position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50; }
  .sheet{ background:#fff; width:100%; border-radius:16px 16px 0 0; padding:18px; }
  .sheet .grabber{ width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 12px; }
  .empty{ text-align:center; color:var(--grey); font-size:12.5px; padding:24px 0; }
  .search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .small-note{ font-size:10.5px; color:var(--amber); margin-top:8px; }
  .barchart{ display:flex; align-items:flex-end; gap:8px; height:110px; margin:10px 0 4px; }
  .barchart .bar{ flex:1; background:var(--accent-light); border:1px solid var(--accent); border-radius:4px 4px 0 0; position:relative; }
  .barchart .bar span{ position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; color:var(--accent); font-weight:700; }
  .barlabels{ display:flex; gap:8px; }
  .barlabels div{ flex:1; text-align:center; font-size:9.5px; color:var(--grey); }
    .accordion-header{ display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:1px 0; }
  .accordion-chevron{ transition:transform .15s; font-size:15px; color:var(--grey); display:inline-block; }
  .accordion-chevron.open{ transform:rotate(90deg); }
  .file-input-wrap{ display:inline-block; }
  .file-input-wrap input[type=file]{ display:none; }
  .top-actions{ display:flex; gap:10px; margin-bottom:14px; }
  .user-avatar{ width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; cursor:pointer; flex:none; }
  .user-menu{ position:absolute; top:56px; right:16px; background:#fff; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.28); min-width:180px; z-index:70; overflow:hidden; border:1px solid var(--border); }
  .user-menu .um-header{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; color:var(--grey); }
  .user-menu .um-header b{ display:block; font-size:13px; color:var(--dark); margin-top:2px; }
  .user-menu .um-item{ padding:12px 14px; font-size:13px; color:var(--red); cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:600; }
  .user-menu .um-item:active{ background:var(--bg-soft); }
</style>

function ncTotalDefectos(nc){
  return (nc.articulos||[]).reduce((s,a) => s + (a.defectos?a.defectos.length:0), 0);
}
function ncTotalEvidencia(nc){
  let c = 0;
  (nc.articulos||[]).forEach(a => (a.defectos||[]).forEach(d => c += (d.evidencia?d.evidencia.length:0)));
  return c;
}
function ncTieneDefectoNuevo(nc){
  return (nc.articulos||[]).some(a => (a.defectos||[]).some(d => d.isOtro));
}
function ncCriticidad(nc){
  return { label:"Grave", color:"var(--amber)" };
}
function ncMotivoResumen(nc){
  const all = [];
  (nc.articulos||[]).forEach(a => (a.defectos||[]).forEach(d => {
    all.push(d.isOtro ? `Nuevo: ${d.descripcionOtro||"(sin descripción)"}` : d.motivo);
  }));
  if(all.length===0) return "-";
  if(all.length===1) return all[0];
  return `${all[0]} (+${all.length-1} más)`;
}
function defectoLabel(d){
  return d.isOtro ? `Nuevo: ${d.descripcionOtro||"(sin descripción)"}` : (d.motivo||"(sin motivo)");
}
function ncAreasCompleto(nc){
  const areas = [];

    const ar = defectoAreaFinal(d);
    if(ar && !areas.includes(ar)) areas.push(ar);
  }));
  return areas.length ? areas.join(", ") : "-";
}
function ncMotivosCompleto(nc){
  const all = [];
  (nc.articulos||[]).forEach(a => (a.defectos||[]).forEach(d => {
    all.push(defectoLabel(d));
  }));
  return all.length ? all.join("; ") : "-";
}
function ncDetalleDefectosTexto(nc){

function defectoAreaFinal(d){

function ncAreasResumen(nc){
  const areas = [];
  (nc.articulos||[]).forEach(a => (a.defectos||[]).forEach(d => {
    const ar = defectoAreaFinal(d);
    if(ar && !areas.includes(ar)) areas.push(ar);
  }));
  if(areas.length===0) return "-";
  if(areas.length===1) return areas[0];
  return `${areas[0]} (+${areas.length-1} más)`;
}
function ncHasArea(nc, area){
  return (nc.articulos||[]).some(a => (a.defectos||[]).some(d => defectoAreaFinal(d)===area));
}
function registrarDefectosNuevosPendientes(nc){
  nc.articulos.forEach(a => a.defectos.forEach(d => {
    if(d.isOtro){
      const yaExiste = state.defectosPendientesCatalogo.some(p => p.ncId===nc.id && p.articulo===a.nombre && p.descripcion===d.descripcionOtro);
      if(!yaExiste){
        state.defectosPendientesCatalogo.unshift({
          descripcion: d.descripcionOtro, ncId: nc.id, partida: nc.partida,
          articulo: a.nombre, fecha: nowStr(), usuario: state.user.nombre,
        });
      }
    }
  }));
}
function findDefectoNuevo(it){
  const nc = state.ncs.find(x=>x.id===it.ncId);
  if(!nc) return null;
  for(const a of nc.articulos){
    for(const d of a.defectos){
      if(d.isOtro && d.descripcionOtro===it.descripcion) return { nc, articulo:a, defecto:d };
    }
  }
  return null;
}

function render(){
  let html = "";
  switch(state.screen){
    case "login": html = screenLogin(); break;
    case "inicio": html = screenInicio(); break;
    case "evolutivo": html = screenEvolutivo(); break;
    case "defectosPendientes": html = screenDefectosPendientes(); break;
    case "revisarDefectoNuevo": html = screenRevisarDefectoNuevo(); break;
    case "grabarMotivo": html = screenGrabarMotivo(); break;
    case "paso1": html = screenPaso1(); break;
    case "paso2": html = screenPaso2(); break;
    case "paso3": html = screenPaso3(); break;
    case "confirm": html = screenConfirm(); break;
    case "consulta": html = screenConsulta(); break;
    case "detalle": html = screenDetalle(); break;
    case "editNC": html = screenEditarNC(); break;
    case "seguimiento": html = screenSeguimiento(); break;
    default: html = screenLogin();
  }
  $("app").innerHTML = html;
  // modal overlay (anular)
  if(state.anular.open){
    $("app").insertAdjacentHTML("beforeend", anularModalHTML());
  }
  // generic confirm dialog (replaces native confirm() so it always works, even inside embedded previews)
  if(state.confirmDlg.open){
    $("app").insertAdjacentHTML("beforeend", confirmDlgHTML());
  }
  // full-screen photo viewer
  if(state.photoView.open){
    $("app").insertAdjacentHTML("beforeend", photoViewHTML());
  }
  // motivo de edición
  if(state.editMotivo.open){
    $("app").insertAdjacentHTML("beforeend", editMotivoHTML());
  }
  // edición de un defecto específico (ventana enfocada)
  if(state.editDefectoModal.open){
    $("app").insertAdjacentHTML("beforeend", editDefectoModalHTML());
  }
  // registro/edición de un defecto durante el asistente de registro
  if(state.draftDefModal.open){
    $("app").insertAdjacentHTML("beforeend", draftDefectoModalHTML());
  }
  // selección de reportes descargables (Evolutivo)
  if(state.reporteModal.open){
    $("app").insertAdjacentHTML("beforeend", reporteModalHTML());
  }
}

function parseDMY(s){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s||"").trim());
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function inicioBuscar(){
  const f = state.inicioFilters;
  const nc = (f.nc||"").toLowerCase();
  const area = f.area;
  const resp = (f.resp||"").toLowerCase();
  const iniD = parseDMY(f.ini);
  const finD = parseDMY(f.fin);
  state.inicioResults = state.ncs.filter(x => {
    if(nc && !x.id.toLowerCase().includes(nc) && !x.partida.includes(nc)) return false;
    if(area && !ncHasArea(x, area)) return false;
    if(resp && !x.registradoPor.toLowerCase().includes(resp)) return false;
    const d = parseDMY(x.fecha.split(' ')[0]);
    if(iniD && d && d<iniD) return false;
    if(finD && d && d>finD) return false;
    return true;
  });
  render();
}

function parseFechaHora(s){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec((s||"").trim());
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
}
function excelKgAfectado(a){
  const kg = parseFloat(a.kgCrudo), rollos = parseFloat(a.rollos), cant = parseFloat(a.cantidad);
  if(!kg || !rollos || isNaN(cant)) return "";
  return (kg * (cant/rollos)).toFixed(2);
}

function csvEscape(v){
  v = (v===undefined||v===null) ? "" : String(v);
  if(v.indexOf(";")>-1 || v.indexOf('"')>-1 || v.indexOf("\n")>-1){
    v = '"' + v.replace(/"/g,'""') + '"';
  }
  return v;
}
function downloadTextFile(content, filename, mime){
  const blob = new Blob(["\ufeff"+content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
// Genera el contenido del reporte (binario .xlsx si la librería XLSX está disponible,
// o texto .csv como respaldo) sin descargarlo todavía — permite tanto la descarga
// directa de un solo archivo como el empaquetado de varios reportes en un .zip.
function buildExportContent(rows, headers, sheetName, notas){
  if(typeof XLSX !== "undefined"){
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = (headers||[]).map(()=>({wch:17}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, (sheetName||"Reporte").slice(0,31));
    if(notas && notas.length){
      const wsNotas = XLSX.utils.aoa_to_sheet(notas);
      wsNotas['!cols'] = [{wch:100}];
      XLSX.utils.book_append_sheet(wb, wsNotas, "Notas");
    }
    return { data: XLSX.write(wb, { bookType:"xlsx", type:"array" }), ext:"xlsx", isBinary:true };
  }
  const csv = rows.map(r => r.map(csvEscape).join(";")).join("\r\n");
  return { data: "\ufeff"+csv, ext:"csv", isBinary:false };
}
// Mecanismo genérico de exportación (reutilizado por todos los reportes descargables:
// el reporte histórico "NO CONFORME" de Inicio y los reportes de Evolutivo). Usa la
// librería XLSX si está disponible; si no, cae automáticamente a un CSV compatible con Excel.
function exportRowsToFile(rows, headers, sheetName, fileNameBase, notas){
  const safeBase = fileNameBase.replace(/[\/: ]/g,'-');
  const { data, ext, isBinary } = buildExportContent(rows, headers, sheetName, notas);
  if(!isBinary){
    downloadTextFile(data.replace(/^\ufeff/, ""), `${safeBase}.${ext}`, "text/csv;charset=utf-8;");
    showSuccessMessage('Reporte generado en formato CSV (compatible con Excel) — no se pudo cargar la librería .xlsx en este momento (sin conexión a la librería externa).');
    return;
  }
  const blob = new Blob([data], { type:"application/octet-stream" });
  downloadBlob(blob, `${safeBase}.${ext}`);
}

function buildReporteInformeCalidadRows(period){
  const { start, end } = evoPeriodRange(period);

  rows.push([`FECHA INICIO: ${fmtFecha(start)}`]);

  rows.push([]);
  const headers = ["Área Responsable","Orden","Fecha 1er Teñido","Fecha Informe","Fecha Entrega Tela Fin","Días en Planta","Tipo Partida","N° Partida","Cliente","Color","Artículo","Kilos","Motivo Rechazo","Situación","Acciones Correctivas","Proceso"];

  const porArea = {};
  ncsEnPeriodo(period).forEach(nc => {
    nc.articulos.forEach(a => {
      a.defectos.forEach(d => {
        const area = defectoAreaFinal(d);
        if(!porArea[area]) porArea[area] = [];
        porArea[area].push({
          fechaInforme: nc.fecha, partida: nc.partida, cliente: nc.cliente, color: nc.color,
          articulo: a.nombre, kilos: excelKgAfectado(a), motivo: defectoLabel(d),
          situacion: nc.estado, proceso: nc.proceso||"PRODUCCIÓN",
        });
      });
    });
  });

  const areas = Object.keys(porArea).sort();
  const resumen = [];
  let totalGeneral = 0;
  areas.forEach(area => {
    rows.push([`/${area}/`]);
    rows.push(headers);
    let subtotal = 0;
    porArea[area].forEach((r,i) => {
      subtotal += parseFloat(r.kilos) || 0;
      rows.push([
        area, i+1, "", r.fechaInforme, "", "", "", r.partida, r.cliente, r.color, r.articulo,
        r.kilos, r.motivo, r.situacion, "", r.proceso,

  rows.push(["Área Responsable","Kilos Partida"]);
  resumen.forEach(r => rows.push(r));

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return startOfDay(d); }
const DIAS_SEM = ["Do","Lu","Ma","Mi","Ju","Vi","Sa"];
const MESES_ABR = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function getISOWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = date.getTime();
  date.setUTCMonth(0, 1);
  if(date.getUTCDay() !== 4) date.setUTCMonth(0, 1 + ((4 - date.getUTCDay()) + 7) % 7);
  return 1 + Math.round((firstThursday - date.getTime()) / (7*24*3600*1000));
}

function evoData7Dias(){
  const fechas = state.ncs.map(nc => parseFechaHora(nc.fecha)).filter(Boolean);
  const buckets = [];
  for(let i=6;i>=0;i--){
    const day = daysAgo(i);
    const count = fechas.filter(d => startOfDay(d).getTime() === day.getTime()).length;
    buckets.push([DIAS_SEM[day.getDay()], count]);
  }
  return buckets;
}
function evoData4Semanas(){
  const fechas = state.ncs.map(nc => parseFechaHora(nc.fecha)).filter(Boolean);
  const buckets = [];
  for(let w=3;w>=0;w--){
    const finDia = daysAgo(w*7);
    const inicioDia = daysAgo(w*7+6);
    const count = fechas.filter(d => {
      const dd = startOfDay(d).getTime();
      return dd >= inicioDia.getTime() && dd <= finDia.getTime();
    }).length;
    const label = `Sem ${getISOWeek(inicioDia)}`;
    buckets.push([label, count]);
  }
  return buckets;
}
function evoDataMes(){
  const now = new Date();
  const year = now.getFullYear();
  const fechas = state.ncs.map(nc => parseFechaHora(nc.fecha)).filter(Boolean);
  const buckets = [];
  for(let m=0; m<=now.getMonth(); m++){
    const count = fechas.filter(d => d.getFullYear()===year && d.getMonth()===m).length;
    buckets.push([MESES_ABR[m], count]);
  }
  return buckets;
}
function evoDataAnio(){
  const fechas = state.ncs.map(nc => parseFechaHora(nc.fecha)).filter(Boolean);
  const years = [...new Set(fechas.map(d=>d.getFullYear()))].sort();
  if(years.length===0) years.push(new Date().getFullYear());
  return years.map(y => [String(y), fechas.filter(d=>d.getFullYear()===y).length]);
}
function evoAreaData(){
  const counts = {};
  state.ncs.forEach(nc => {
    (nc.articulos||[]).forEach(a => (a.defectos||[]).forEach(d => {
      const ar = defectoAreaFinal(d);
      counts[ar] = (counts[ar]||0) + 1;
    }));
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);
}
function fmtFecha(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
// Calcula el rango de fechas (inicio/fin) correspondiente al periodo actualmente
// seleccionado en la pantalla de Evolutivo ("Año","Mes","4 semanas","7 días").
// Los reportes descargables deben respetar este mismo periodo.
function evoPeriodRange(period){
  const now = new Date();
  if(period === "Año"){
    return { start: new Date(now.getFullYear(), 0, 1), end: startOfDay(now) };
  }
  if(period === "Mes"){
    return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: startOfDay(now) };
  }
  if(period === "4 semanas"){
    return { start: daysAgo(27), end: startOfDay(now) };
  }
  // "7 días"
  return { start: daysAgo(6), end: startOfDay(now) };
}
function ncsEnPeriodo(period){
  const { start, end } = evoPeriodRange(period);
  return state.ncs.filter(nc => {
    const d = parseFechaHora(nc.fecha);
    if(!d) return false;
    const dd = startOfDay(d).getTime();
    return dd >= start.getTime() && dd <= end.getTime();
  });
}

  const anyDefectoData = Object.values(sel).some(s => (s.defectos||[]).some(def =>
    def.motivo || def.isOtro || def.descripcionOtro || def.area || (def.evidencia && def.evidencia.length)
  ));
  return !!(d.partida || d.comentario || anyChecked || anyDefectoData);
}

  if(!ok){ render(); return; }
  const arr = state.draft.seleccion[m.artIdx].defectos;
  const data = { motivo: m.isOtro?"":m.motivo, isOtro:m.isOtro, descripcionOtro:m.descripcionOtro, area:m.area, areaOtro:m.areaOtro, evidencia:m.evidencia, comentario:m.comentario||"", open:false };

  else arr[m.defIdx] = data;

  render();
}

function aplicarGrupoDefecto(){
  const g = state.draft.grupoDefecto;
  g.errors = {};
  let ok = true;
  const seleccionados = Object.keys(g.seleccion).filter(k=>g.seleccion[k]);
  if(seleccionados.length < 1){ g.errors.motivo = "Marque al menos un artículo."; render(); return; }
  if(g.isOtro){
    if(!g.descripcionOtro || !g.descripcionOtro.trim()){ g.errors.desc = "Describa el defecto encontrado."; ok=false; }
  } else if(!g.motivo){ g.errors.motivo = "Seleccione el motivo de rechazo."; ok=false; }
  if(!g.area){ g.errors.area = "Seleccione el área responsable."; ok=false; }
  else if(g.area===OTRA_AREA && !(g.areaOtro||"").trim()){ g.errors.areaOtro = "Especifique el área responsable."; ok=false; }
  if(!g.evidencia || g.evidencia.length===0){ g.errors.evidencia = "La evidencia fotográfica es obligatoria."; ok=false; }
  if(!ok){ render(); return; }
  const comentarioAplicado = (state.draft.comentario||"").trim();
  seleccionados.forEach(idx => {
    const sel = state.draft.seleccion[idx];
    if(!sel) return;
    const nuevo = { motivo: g.isOtro?"":g.motivo, isOtro:g.isOtro, descripcionOtro:g.descripcionOtro, area:g.area, areaOtro:g.areaOtro, evidencia: g.evidencia.map(f=>({...f})), comentario:comentarioAplicado, open:false };
    const vacio = sel.defectos.length===1 && !sel.defectos[0].motivo && !sel.defectos[0].isOtro && !sel.defectos[0].area && sel.defectos[0].evidencia.length===0;
    if(vacio) sel.defectos[0] = nuevo;
    else sel.defectos.push(nuevo);
  });
  state.draft.grupoDefecto = emptyGrupoDefecto();
  render();
}

function toggleDefectoOpen(artIdx, defIdx){
  const def = state.draft.seleccion[artIdx].defectos[defIdx];
  def.open = !def.open;
  render();
}
function updateDefectoMotivo(artIdx, defIdx, val){
  const def = state.draft.seleccion[artIdx].defectos[defIdx];
  if(val === DEFECTO_NUEVO){ def.motivo=""; def.isOtro=true; }
  else { def.motivo=val; def.isOtro=false; }
  render();
}
function updateDefectoArea(artIdx, defIdx, val){
  state.draft.seleccion[artIdx].defectos[defIdx].area = val;
  render();
}
function updateDefectoAreaOtro(artIdx, defIdx, val){
  state.draft.seleccion[artIdx].defectos[defIdx].areaOtro = val;
}
function updateDefectoDescripcionOtro(artIdx, defIdx, val){
  state.draft.seleccion[artIdx].defectos[defIdx].descripcionOtro = val;
}
function addDefecto(artIdx){
  const arr = state.draft.seleccion[artIdx].defectos;
  arr.forEach(def => { def.open = false; });
  arr.push(emptyDefecto());
  render();
}
function removeDefecto(artIdx, defIdx){
  const arr = state.draft.seleccion[artIdx].defectos;
  if(arr.length<=1) return;
  arr.splice(defIdx,1);
  render();
}
function handleDefectoFiles(artIdx, defIdx, files){
  if(!files || !files.length) return;
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      state.draft.seleccion[artIdx].defectos[defIdx].evidencia.push({ name:f.name, dataUrl:e.target.result });
      delete state.errors[`evid_${artIdx}_${defIdx}`];
      render();
    };
    reader.readAsDataURL(f);
  });
}
function removeDefectoEvidencia(artIdx, defIdx, photoIdx){
  state.draft.seleccion[artIdx].defectos[defIdx].evidencia.splice(photoIdx,1);
  render();
}
function validateDefectosStep(){
  clearErrs();
  const d = state.draft;
  let ok = true;
  const checkedIdx = Object.keys(d.seleccion).filter(k => d.seleccion[k].checked);
  checkedIdx.forEach(idx => {
    const sel = d.seleccion[idx];
    sel.defectos.forEach((def, j) => {
      if(def.isOtro){
        if(!def.descripcionOtro || !def.descripcionOtro.trim()){ setErr(`desc_${idx}_${j}`, "Describa el defecto encontrado."); ok=false; def.open=true; }
      } else {
        if(!def.motivo){ setErr(`mot_${idx}_${j}`, "Seleccione el motivo de rechazo."); ok=false; def.open=true; }
        else if(!MOTIVOS.includes(def.motivo)){ setErr(`mot_${idx}_${j}`, "Seleccione un motivo válido de la lista, o elija \"" + DEFECTO_NUEVO + "\"."); ok=false; def.open=true; }
      }
      if(!def.area){ setErr(`area_${idx}_${j}`, "Seleccione el área responsable."); ok=false; def.open=true; }
      else if(def.area!==OTRA_AREA && !AREAS.includes(def.area)){ setErr(`area_${idx}_${j}`, "Seleccione un área válida de la lista, o elija \"" + OTRA_AREA + "\"."); ok=false; def.open=true; }
      if(def.area===OTRA_AREA && (!def.areaOtro || !def.areaOtro.trim())){ setErr(`areaOtro_${idx}_${j}`, "Especifique el área responsable."); ok=false; def.open=true; }
      if(!def.evidencia || def.evidencia.length===0){ setErr(`evid_${idx}_${j}`, "La evidencia fotográfica es obligatoria para este defecto."); ok=false; def.open=true; }
    });
  });
  if(!ok){ setErr('summary','Complete los campos obligatorios marcados en rojo, incluyendo la evidencia fotográfica de cada defecto.'); render(); return; }
  goTo("paso3");
}

function registrarNC(){
  const d = state.draft;
  const checkedIdx = Object.keys(d.seleccion).filter(k=>d.seleccion[k].checked);
  const articulos = checkedIdx.map(k=>{
    const a = d.articulosDisponibles[k]; const sel = d.seleccion[k];
    return {
      tipo:a.tipo, nombre:a.nombre, codTela:a.codTela, talla:a.talla, kgCrudo:a.kgCrudo, rollos:a.rollos,
      cantidad:parseInt(sel.cantidad,10),
      defectos: sel.defectos.map(def => ({
        motivo: def.isOtro ? "" : def.motivo, isOtro: def.isOtro, descripcionOtro: def.descripcionOtro,
        area: def.area, areaOtro: def.areaOtro,
        evidencia: def.evidencia.slice(),
        comentario: def.comentario||"",
      })),
    };
  });
  if(state.editingId){
    const nc = state.ncs.find(x=>x.id===state.editingId);
    Object.assign(nc, {
      partida:d.partida, cliente:d.cliente, color:d.color, peso:d.peso, fechaPartida:d.fechaPartida,
      articulos, comentario:d.comentario,
    });
    nc.historial.push({ fecha:nowStr(), usuario:state.user.nombre, accion:"Editó la No Conformidad" });
    registrarDefectosNuevosPendientes(nc);
    state.lastRegisteredId = nc.id;
    state.lastAction = "updated";
  } else {
    const id = ncId(nextNum++);
    const fechaFinal = d.fechaRegistro || nowStr();
    const nc = {
      id, estado:"Registrada", status:"Rechazado", proceso:"PRODUCCIÓN", fecha:fechaFinal, registradoPor:state.user.nombre,
      partida:d.partida, cliente:d.cliente, color:d.color, peso:d.peso, fechaPartida:d.fechaPartida,
      articulos, comentario:d.comentario,
      historial:[{ fecha:fechaFinal, usuario:state.user.nombre, accion:"Creación de NC" }],
      anulacion:null,
    };
    state.ncs.unshift(nc);
    registrarDefectosNuevosPendientes(nc);
    state.lastRegisteredId = id;
    state.lastAction = "created";
  }
  state.draft = null; state.editingId = null;
  goTo("confirm");
}

function buscarConsulta(){
  const nc = (state.consultaFilters.nc||"").toLowerCase();

  state.consultaResults = state.ncs.filter(x => {
    if(nc && !x.id.toLowerCase().includes(nc) && !x.partida.includes(nc)) return false;

    if(resp && !x.registradoPor.toLowerCase().includes(resp)) return false;
    return true;
  });
  render();

function handleDetalleDefectoFiles(ai, di, files){
  const nc = state.ncs.find(x=>x.id===state.detailId);
  if(!nc) return;
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      nc.articulos[ai].defectos[di].evidencia.push({ name:f.name, dataUrl:e.target.result });
      nc.historial.push({ fecha:nowStr(), usuario:state.user.nombre, accion:`Agregó evidencia fotográfica al defecto "${defectoLabel(nc.articulos[ai].defectos[di])}" de "${nc.articulos[ai].nombre}"` });
      state.detalleOpen.defectos = true;
      render();
    };
    reader.readAsDataURL(f);
  });
}
function editarNC(id){
  const nc = state.ncs.find(x=>x.id===id);
  state.editingId = id;
  state.editForm = {
    articulos: nc.articulos.map(a => ({

function iniciarGuardarEdicion(){
  clearErrs();
  const ef = state.editForm;
  let ok = true;
  const problemas = [];
  ef.articulos.forEach((a,idx) => {
    if(!a.open) return; // artículos no marcados para editar conservan su información sin validarse nuevamente
    const n = parseInt(a.cantidad,10);
    if(!a.cantidad || isNaN(n) || n<=0){ setErr(`eart_${idx}`, "Ingrese la cantidad afectada."); ok=false; problemas.push(`Cantidad afectada de "${a.nombre}"`); }
    else if(n > a.rollos){ setErr(`eart_${idx}`, `La cantidad no puede superar el total disponible (${a.rollos}).`); ok=false; problemas.push(`Cantidad afectada de "${a.nombre}"`); }
    a.defectos.forEach((def,j) => {
      let defOk = true;
      if(def.isOtro){ if(!def.descripcionOtro || !def.descripcionOtro.trim()) defOk = false; }
      else if(!def.motivo || !MOTIVOS.includes(def.motivo)) defOk = false;
      if(!def.area) defOk = false;
      else if(def.area!==OTRA_AREA && !AREAS.includes(def.area)) defOk = false;
      if(def.area===OTRA_AREA && !(def.areaOtro||"").trim()) defOk = false;
      if(!def.evidencia || def.evidencia.length===0) defOk = false;
      if(!defOk){ ok=false; problemas.push(`Defecto ${j+1} de "${a.nombre}"`); }
    });
  });
  if(!ok){ setErr('summary', `Complete los datos obligatorios en: ${problemas.join("; ")}. Toque "Editar" en cada ítem para corregirlo.`); render(); return; }
  const huboSeleccion = ef.articulos.some(a=>a.open);
  const soloComentario = !huboSeleccion;
  if(!editFormHasChanges()){ setErr('summary', soloComentario ? 'No se detectaron cambios para guardar. Marque un artículo para editarlo, o modifique el comentario.' : 'No se detectaron cambios para guardar.'); render(); return; }
  state.editMotivo = { open:true, sel:"", otro:"", error:"" };
  render();
}
function cancelEditMotivo(){ state.editMotivo = { open:false, sel:"", otro:"", error:"" }; render(); }
function updateEditMotivoSel(val){ state.editMotivo.sel = val; state.editMotivo.error=""; render(); }
function confirmEditMotivo(){
  const em = state.editMotivo;
  const motivoFinal = em.sel === "Otros" ? (em.otro||"").trim() : em.sel;
  if(!em.sel){
    em.error = "Seleccione el motivo de edición.";
    render(); return;
  }
  if(em.sel === "Otros" && !motivoFinal){
    em.error = "Especifique el motivo de la edición.";
    render(); return;
  }
  const nc = state.ncs.find(x=>x.id===state.editingId);
  const ef = state.editForm;
  const changes = [];
  if((nc.comentario||"") !== (ef.comentario||"")) changes.push("Comentario actualizado");
  ef.articulos.forEach((a,idx) => {
    const orig = nc.articulos[idx];
    if(!orig) return;
    if(String(orig.cantidad) !== String(a.cantidad)) changes.push(`Cantidad de "${a.nombre}": ${orig.cantidad} → ${a.cantidad}`);
    if(orig.defectos.length !== a.defectos.length) changes.push(`N° de defectos de "${a.nombre}": ${orig.defectos.length} → ${a.defectos.length}`);
    else {
      a.defectos.forEach((d,j) => {
        const o = orig.defectos[j];
        if(!o) return;
        if(defectoLabel(o) !== defectoLabel(d)) changes.push(`Defecto ${j+1} de "${a.nombre}": "${defectoLabel(o)}" → "${defectoLabel(d)}"`);
        if(defectoAreaFinal(o) !== defectoAreaFinal(d)) changes.push(`Área del defecto ${j+1} de "${a.nombre}": "${defectoAreaFinal(o)}" → "${defectoAreaFinal(d)}"`);
        if(o.evidencia.length !== d.evidencia.length) changes.push(`Evidencia del defecto ${j+1} de "${a.nombre}": ${o.evidencia.length} → ${d.evidencia.length} foto(s)`);
      });
    }
  });
  nc.comentario = ef.comentario;
  nc.articulos = ef.articulos.map(a => ({
    ...a, cantidad: parseInt(a.cantidad,10),
    defectos: a.defectos.map(d => ({ ...d })),
  }));
  registrarDefectosNuevosPendientes(nc);
  const resumen = changes.length ? changes.join("; ") : "sin cambios en los valores";
  nc.historial.push({ fecha: nowStr(), usuario: state.user.nombre, accion: `Editó la No Conformidad. Motivo de edición: "${motivoFinal}". Cambios: ${resumen}.` });
  state.editMotivo = { open:false, sel:"", otro:"", error:"" };
  state.editForm = null;
  state.lastMensajesInfo = { ncId: nc.id, tipo:"editada", extra:{ motivoEdicion: motivoFinal } };
  goTo("inicio");
  showSuccessMessage("La No Conformidad se editó correctamente.");
}

}
function anularModalHTML(){
  const a = state.anular;
  const nc = state.ncs.find(x=>x.id===a.ncId);
  const isOtros = a.sel === "Otros";
  if(a.step===1){
    return `
      <div class="overlay">
        <div class="sheet">
          <div class="grabber"></div>
          <h2 style="margin:0 0 4px;font-size:15px;">Anular No Conformidad</h2>
          <p class="hint" style="margin:0 0 10px;">Partida <b>${esc(nc.partida)}</b> · ${esc(nc.id)}</p>
          <p class="hint">Esta acción no elimina el registro; quedará marcada como Anulada, con historial visible.</p>
          <div class="${a.error ? 'field error' : 'field'}">
            <label>Motivo de anulación <span class="req">*</span></label>
            <select id="motivoAnularSel" onchange="updateAnularSel(this.value)">
              <option value="">Seleccionar...</option>
              ${MOTIVOS_ANULACION.map(m=>`<option ${a.sel===m?'selected':''}>${esc(m)}</option>`).join("")}
            </select>
            ${a.error ? `<div class="field-err">${esc(a.error)}</div>` : ""}
          </div>
          ${isOtros ? `
          <div class="field">
            <label>Especifique el motivo <span class="req">*</span></label>
            <textarea id="motivoAnularOtro" placeholder="Describa el motivo de la anulación" oninput="state.anular.otro=this.value">${esc(a.otro)}</textarea>
          </div>` : ""}
          <div style="display:flex;gap:10px;margin-top:6px;">
            <button class="btn btn-secondary" onclick="closeAnular()">Cancelar</button>
            <button class="btn btn-danger-solid" onclick="continuarAnular()">Continuar</button>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="overlay">
      <div class="sheet">
        <div class="grabber"></div>
        <h2 style="margin:0 0 10px;font-size:15px;">¿Está seguro de anular la No Conformidad correspondiente a la Partida ${esc(nc.partida)}?</h2>
        <p class="hint" style="margin-top:-6px;">${esc(nc.id)}</p>
        <p class="hint">Se registrará usuario, fecha/hora y el motivo indicado.</p>
        <p style="font-size:12.5px;background:var(--bg-soft);padding:8px 10px;border-radius:8px;">${esc(anularMotivoFinal())}</p>
        <button class="btn btn-danger-solid btn-block" onclick="confirmarAnular()">Confirmar anulación</button>
        <div style="height:10px;"></div>
        <button class="btn btn-secondary btn-block" onclick="closeAnular()">Cancelar</button>
      </div>
    </div>
  `;
}
function continuarAnular(){
  if(!state.anular.sel){
    state.anular.error = "Seleccione el motivo de anulación.";
    render(); return;
  }
  if(state.anular.sel === "Otros" && !(state.anular.otro||"").trim()){
    state.anular.error = "Especifique el motivo de la anulación.";
    render(); return;
  }
  state.anular.error = ""; state.anular.step = 2; render();
}
function confirmarAnular(){
  const nc = state.ncs.find(x=>x.id===state.anular.ncId);
  const motivoFinal = anularMotivoFinal();
  nc.estado = "Anulada";
  nc.anulacion = { motivo: motivoFinal, usuario: state.user.nombre, fecha: nowStr() };
  nc.historial.push({ fecha: nowStr(), usuario: state.user.nombre, accion: "Anuló la No Conformidad. Motivo: "+motivoFinal });
  state.lastMensajesInfo = { ncId: nc.id, tipo:"anulada", extra:{ motivoAnulacion: motivoFinal } };
  closeAnular();
  goTo("inicio");
  showSuccessMessage("La No Conformidad fue anulada correctamente.");
}

/* =========================================================
   SEGUIMIENTO POR CRITICIDAD
========================================================= */
function screenSeguimiento(){
  const filt = state.seguimientoFilter;
  const active = state.ncs.filter(x=>x.estado!=="Anulada").map(nc => Object.assign({}, nc, { categoria: ncTieneDefectoNuevo(nc) ? "Nuevo" : "Catalogado" }));
  const groups = [
    { key:"Nuevo",      label:"Con defecto nuevo (requiere revisión)", color:"var(--amber)", cls:"chip-grave" },
    { key:"Catalogado", label:"Catalogado",                             color:"var(--accent)", cls:"chip-all" },
  ];
  const visibleGroups = filt==="Todas" ? groups : groups.filter(g=>g.key===filt);

  function card(nc){
    const totalRollos = nc.articulos.reduce((s,a)=>s+a.cantidad,0);
    const border = nc.categoria==="Nuevo" ? "var(--amber)" : "var(--accent)";
    return `
      <div class="list-card" style="border-left:4px solid ${border};cursor:pointer;" onclick="openDetalle('${nc.id}')">
        <div class="list-top"><span>${esc(nc.id)}</span><span style="font-weight:400;color:var(--grey);font-size:11px;">${esc(nc.fecha.split(' ')[0])}</span></div>
        <div class="list-sub"><b>Partida ${esc(nc.partida)}</b> · ${esc(ncAreasResumen(nc))}</div>
        <div class="list-sub">${esc(ncMotivoResumen(nc))} · ${esc(nc.registradoPor)}</div>
        <div class="list-bottom"><span class="list-sub">${totalRollos} rollo(s) afectado(s)</span><span class="linklike">Ver detalle ›</span></div>
      </div>
    `;
  }

  const sections = visibleGroups.map(g => {
    const items = active.filter(nc => nc.categoria === g.key);
    if(items.length===0 && filt==="Todas") return "";
    const body = items.length ? items.map(card).join("") : `<div class="empty">Sin registros en esta categoría.</div>`;
    return `
      <div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${g.color};display:inline-block;"></span>
        <b style="font-size:13px;">${g.label}</b>
        <span style="color:var(--grey);font-size:11.5px;">(${items.length})</span>
      </div>
      ${body}
    `;
  }).join("");

  return shell("Seguimiento por Criticidad", "Priorización de NC para atención", "goTo('inicio')", `
    <div class="banner-sim">Al eliminarse el campo "Grado de defecto", la priorización debe redefinirse con Usuario. Provisionalmente se agrupa según si la NC contiene un defecto "${esc(DEFECTO_NUEVO)}" pendiente de catalogar (mayor atención) o solo defectos ya catalogados.</div>
    <b style="font-size:12px;">Filtrar:</b>
    <div style="margin:8px 0 4px;">
      ${["Todas","Nuevo","Catalogado"].map(p=>{
        const cls = p==="Nuevo"?"chip-grave":p==="Catalogado"?"chip-all":"chip-all";
        const label = p==="Nuevo" ? "Con defecto nuevo" : p;
        return `<span class="chip ${cls} ${filt===p?'active':''}" onclick="setSeguimientoFilter('${p}')">${label}</span>`;
      }).join("")}
    </div>
    ${sections || `<div class="empty">No hay No Conformidades para este filtro.</div>`}
    <div class="small-note">Columna "Estado de atención": solo si se define el flujo de seguimiento (fase 2, pendiente con Usuario).</div>
  `, null);
}
function setSeguimientoFilter(p){ state.seguimientoFilter = p; render(); }

/* =========================================================
   NAV FOOTER (accesos rápidos entre pantallas, ayuda de prueba)
========================================================= */
function quickNav(){
  return `
    <div style="position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:99;background:#111;color:#fff;border-radius:20px;padding:6px 10px;font-size:10px;display:flex;gap:8px;opacity:.85;">
      <span onclick="goTo('inicio')" style="cursor:pointer;">Inicio</span>|
      <span onclick="goTo('consulta')" style="cursor:pointer;">Consulta</span>|
      <span onclick="goTo('seguimiento')" style="cursor:pointer;">Criticidad</span>
    </div>
  `;
}

/* INIT */
render();
</script>
