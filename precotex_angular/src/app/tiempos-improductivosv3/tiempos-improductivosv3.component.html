<div class="tiempo-improductivov3-container">
    <div class="selector-titulo">
        <h3 class="titulo">REGISTRO DE TIEMPO IMPRODUCTIVO</h3>
    </div>

    <div class="form-columns">

        <section class="left">

            <!-- Primera Fila -->
            <div class="row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Máquina</mat-label>
                    <mat-select formControlName="maquina">
                        <mat-option *ngFor="let m of maquinas" [value]="m">{{ m }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <!-- Segunda Fila -->
            <div class="row two-columns">
                <mat-form-field appearance="outline" class="dni-field">
                    <mat-label>DNI</mat-label>
                    <input matInput formControlName="dni" maxlength="8">
                </mat-form-field>

                <mat-form-field appearance="outline" class="operador-field">
                    <mat-label>Operador</mat-label>
                    <input matInput formControlName="operador">
                </mat-form-field>
            </div>    
            
            <!-- Tercera Fila -->
            <div class="row two-columns">
                <mat-form-field appearance="outline" class="codigo-field">
                    <mat-label>Codigo Motivo</mat-label>
                    <input matInput formControlName="codMotivo">
                </mat-form-field>

                <mat-form-field appearance="outline" class="motivo-field">
                    <mat-label>Motivo</mat-label>
                    <input matInput formControlName="motivo">
                </mat-form-field>                
            </div>

            <!-- Cuarta Fila -->
            <div class="row two-columns">
                <button mat-raised-button color="primary" class="btn-action">
                    <mat-icon>timer</mat-icon>
                    Iniciar
                </button>

                <button mat-raised-button color="primary" class="btn-action">
                    <mat-icon>stop</mat-icon>
                    Detener
                </button>                
            </div>

            <!-- Quinta Fila -->
            <div class="row two-columns">
                <mat-form-field appearance="outline" class="horaIni-field">
                    <mat-label>Hora Inicio</mat-label>
                    <input matInput formControlName="horaIni">
                </mat-form-field>

                <mat-form-field appearance="outline" class="horaFin-field">
                    <mat-label>Hora Fin</mat-label>
                    <input matInput formControlName="horaFin">
                </mat-form-field>                
            </div>

            <!-- Quinta Fila: Observación -->
            <div class="row">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Observación</mat-label>
                    <textarea matInput formControlName="observacion" rows="3"></textarea>
                </mat-form-field>
            </div>            

        </section>

        <section class="right">

            <h3 class="subtitulo">LISTADO DE MOTIVO</h3>
            <table mat-table [dataSource]="motivos" class="mat-elevation-z2">
            <ng-container matColumnDef="codigo">
                <th mat-header-cell *matHeaderCellDef> COD </th>
                <td mat-cell *matCellDef="let m"> {{ m.codigo }} </td>
            </ng-container>

            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef> MOTIVO </th>
                <td mat-cell *matCellDef="let m"> {{ m.descripcion }} </td>
            </ng-container>

            <ng-container matColumnDef="area">
                <th mat-header-cell *matHeaderCellDef> AREA </th>
                <td mat-cell *matCellDef="let m"> {{ m.area }} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['codigo', 'descripcion', 'area']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['codigo', 'descripcion', 'area'];"></tr>
            </table>            

        </section>    

    </div>

</div>
